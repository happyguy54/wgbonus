<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výpočet Bonusů</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        // Function to delete all cookies
        function deleteAllCookies() {
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i];
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            }
        }

        // Delete cookies on page load
        window.onload = deleteAllCookies;
    </script>
</head>
<body>
<script src="script.js"></script>
<h1>Vložte tabulku pro výpočet bonusu</h1>

<div class="container">
    <div class="left-section">
        <textarea class="inputText" id="inputText" placeholder="Vložte text zde..."></textarea>
        <button class="submit" onclick="processData()">Zpracovat</button>
        <div id="editableInputs">
            <h3>Upravitelné hodnoty</h3>
            <table>
                <tr>
                    <td class="l">
                        <label for="input-pripravenost">Připravenost:</label>
                        <input class="short" id="input-pripravenost" name="pripravenost" type="text" size="6" value="100"> z 100
                    </td>
                </tr>
                <tr>
                    <td class="l">
                        <label for="input-spokojenost">Spokojenost:</label>
                        <input class="short" id="input-spokojenost" name="spokojenost" type="text" size="6" value="100"> z 100
                    </td>
                </tr>
                <tr>
                    <td class="l">
                        <label for="input-silaZbraniEffect">Síla zbraní:</label>
                        <input class="short" id="input-silaZbraniEffect" name="silaZbraniEffect" type="text" size="6" value="0"> z 100
                    </td>
                </tr>
                <tr>
                    <td class="l">
                        <label for="input-zkušenostiEffect">Zkušenosti:</label>
                        <input class="short" id="input-zkušenostiEffect" name="zkušenostiEffect" type="text" size="6" value="25"> z 100
                    </td>
                </tr>
                <tr>
                    <td class="l">
                        <label for="input-vojenskeZakladny">Vojenské základny:</label>
                        <input class="short" id="input-vojenskeZakladny" name="vojenskeZakladny" type="text" size="6" value="0"> z 100
                    </td>
                </tr>
                <tr>
                    <td class="l">
                        <label for="input-plazmy">Plazmy:</label>
                        <input class="short" id="input-plazmy" name="plazmy" type="text" size="6" value="0"> z 100
                    </td>
                </tr>
            </table>
            <button class="submit" onclick="refreshBonuses()">Refresh</button>
        </div>
    </div>
    <div id="output"></div>
</div>

</br>

<div>
    <p>Define your function using available variables: A, B</p>
    <input id="functionInput" type="text" placeholder="e.g., A + B * 2">
    <button id="calculate">Calculate</button>
</div>
</body>
</html>
