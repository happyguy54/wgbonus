<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výpočet Bonusů</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        // Function to delete all cookies
        function deleteAllCookies() {
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i];
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
            }
        }

        // Delete cookies on page load
        window.onload = deleteAllCookies;
    </script>
</head>
<body>

<h1>Vložte tabulku pro výpočet bonusu</h1>

<div class="container">
    <div class="left-section">
        <textarea class="inputText" id="inputText" placeholder="Vložte text zde..."></textarea>
        <button class="submit" onclick="processData()">Zpracovat</button>
        <div id="editableInputs">
            <h3>Upravitelné hodnoty</h3>
            <label for="pripravenost">Připravenost:</label>
            <input id="pripravenost" type="number" value="100" style="width: 100px;"><br>
            <label for="spokojenost">Spokojenost:</label>
            <input id="spokojenost" type="number" value="100" style="width: 100px;"><br>
            <label for="silaZbraniEffect">Síla zbraní:</label>
            <input id="silaZbraniEffect" type="number" value="0" style="width: 100px;"><br>
            <label for="zkušenostiEffect">Zkušenosti:</label>
            <input id="zkušenostiEffect" type="number" value="25" style="width: 100px;"><br>
            <label for="vojenskeZakladny">Vojenské základny:</label>
            <input id="vojenskeZakladny" type="number" value="0" style="width: 100px;"><br>
            <label for="plazmy">Plazmy:</label>
            <input id="plazmy" type="number" value="0" style="width: 100px;"><br>
            <button class="submit" onclick="refreshBonuses()">Refresh</button>
        </div>
    </div>
    <div id="output"></div>
</div>

</br>

<div>
    <p>Define your function using available variables: A, B</p>
    <input id="functionInput" type="text" placeholder="e.g., A + B * 2">
    <button id="calculate">Calculate</button>
</div>

<script src="script.js"></script>
</body>
</html>
